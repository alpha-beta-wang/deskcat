name: Package native Mochi

on:
  workflow_dispatch:
  push:
    paths: ["native/**", "assets/cats/**", ".github/workflows/native-package.yml"]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: dotnet publish native/windows/Mochi.Native.csproj -c Release -o dist/Mochi.Native-win-x64
      - uses: actions/upload-artifact@v4
        with: { name: Mochi.Native-win-x64, path: dist/Mochi.Native-win-x64 }
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x native/macos/build.sh && cd native/macos && ./build.sh
      - uses: actions/upload-artifact@v4
        with: { name: Mochi.Native-macos, path: dist/Mochi.Native-macos }
